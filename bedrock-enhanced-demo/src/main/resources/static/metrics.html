<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Enhanced Client — Metrics Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e7e9ea;
            padding: 24px 32px;
        }

        h1 { font-size: 22px; color: #f0f6fc; margin-bottom: 8px; }
        h1 span { color: #58a6ff; }
        .subtitle { font-size: 14px; color: #8b949e; margin-bottom: 24px; }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }

        button {
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #e7e9ea;
            cursor: pointer;
        }
        button:hover { border-color: #58a6ff; background: #292e36; }
        .btn-refresh { background: #1f6feb; border-color: #1f6feb; color: white; }
        .status { font-size: 13px; color: #8b949e; }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }

        .chart-card h3 {
            font-size: 15px;
            color: #8b949e;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .chart-card.full-width {
            grid-column: 1 / -1;
        }

        /* SVG chart styles */
        svg { width: 100%; height: 200px; }
        .line-default { stroke: #6b7280; stroke-width: 2; fill: none; }
        .line-sliding { stroke: #f97316; stroke-width: 2; fill: none; }
        .line-costopt { stroke: #3fb950; stroke-width: 2; fill: none; }
        .axis { stroke: #30363d; stroke-width: 1; }
        .axis-label { fill: #8b949e; font-size: 11px; }
        .grid-line { stroke: #21262d; stroke-width: 0.5; }
        .dot { r: 3; }
        .dot-default { fill: #6b7280; }
        .dot-sliding { fill: #f97316; }
        .dot-costopt { fill: #3fb950; }

        .legend {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; color: #8b949e; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        .legend-dot.default { background: #6b7280; }
        .legend-dot.sliding { background: #f97316; }
        .legend-dot.costopt { background: #3fb950; }

        /* Data table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .data-table th {
            text-align: left;
            padding: 8px 10px;
            color: #8b949e;
            border-bottom: 1px solid #30363d;
            font-weight: 500;
        }
        .data-table td {
            padding: 6px 10px;
            border-bottom: 1px solid #21262d;
            color: #c9d1d9;
        }
        .data-table tr:hover td { background: #1c2128; }
        .val-default { color: #9ca3af; }
        .val-sliding { color: #fb923c; }
        .val-costopt { color: #4ade80; font-weight: 600; }

        .empty-msg {
            text-align: center;
            padding: 60px;
            color: #484f58;
            font-size: 16px;
        }

        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav { margin-bottom: 16px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">← Demo App</a> &nbsp;|&nbsp; <a href="/slides.html">Slides</a>
    </div>

    <h1><span>Metrics Dashboard</span> — Per-Turn Analysis</h1>
    <p class="subtitle">Run the Auto Demo on the main page, then view detailed per-turn metrics here.</p>

    <div class="controls">
        <button class="btn-refresh" onclick="loadMetrics()">Refresh Metrics</button>
        <span class="status" id="status">No data yet</span>
    </div>

    <div id="content">
        <div class="empty-msg">No metrics recorded yet. Run the <a href="/">Auto Demo</a> first, then come back here.</div>
    </div>

    <script>
        async function loadMetrics() {
            try {
                const resp = await fetch('/api/metrics');
                const data = await resp.json();

                if (!data || data.length === 0) {
                    document.getElementById('status').textContent = 'No data yet';
                    return;
                }

                document.getElementById('status').textContent = `${data.length} turns recorded`;
                renderDashboard(data);
            } catch (err) {
                document.getElementById('status').textContent = 'Error: ' + err.message;
            }
        }

        function renderDashboard(data) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot default"></div>Default (no management)</div>
                    <div class="legend-item"><div class="legend-dot sliding"></div>Sliding Window</div>
                    <div class="legend-item"><div class="legend-dot costopt"></div>Cost Optimized</div>
                </div>

                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>Cumulative Cost ($)</h3>
                        ${renderLineChart(data, ['defaultCost', 'slidingCost', 'costOptCost'], '$')}
                    </div>
                    <div class="chart-card">
                        <h3>Context Window Size (tokens)</h3>
                        ${renderLineChart(data, ['defaultCtxWindow', 'slidingCtxWindow', 'costOptCtxWindow'], '')}
                    </div>
                    <div class="chart-card">
                        <h3>Cumulative Input Tokens</h3>
                        ${renderLineChart(data, ['defaultInputTokens', 'slidingInputTokens', 'costOptInputTokens'], '')}
                    </div>
                    <div class="chart-card">
                        <h3>Savings vs Default (%)</h3>
                        ${renderLineChart(data, ['slidingVsDefaultPct', 'costOptVsDefaultPct'], '%', true)}
                    </div>
                    <div class="chart-card">
                        <h3>Cache Read Tokens (Cost Optimized)</h3>
                        ${renderBarChart(data, 'cacheReadTokens')}
                    </div>
                    <div class="chart-card">
                        <h3>Cache Read Savings ($)</h3>
                        ${renderBarChart(data, 'cacheReadSavings')}
                    </div>
                </div>

                <div class="chart-card full-width" style="margin-bottom:24px;">
                    <h3>Raw Data — All Turns</h3>
                    ${renderTable(data)}
                </div>
            `;
        }

        function renderLineChart(data, keys, unit, twoLine) {
            const W = 500, H = 180, PAD = 40;
            const plotW = W - PAD * 2, plotH = H - PAD * 1.5;

            let maxVal = 0;
            data.forEach(d => keys.forEach(k => { if (d[k] > maxVal) maxVal = d[k]; }));
            if (maxVal === 0) maxVal = 1;

            const colors = twoLine
                ? ['#f97316', '#3fb950']
                : ['#6b7280', '#f97316', '#3fb950'];

            let paths = keys.map((key, ki) => {
                let points = data.map((d, i) => {
                    const x = PAD + (i / Math.max(data.length - 1, 1)) * plotW;
                    const y = PAD + plotH - (d[key] / maxVal) * plotH;
                    return `${x},${y}`;
                });
                let dots = data.map((d, i) => {
                    const x = PAD + (i / Math.max(data.length - 1, 1)) * plotW;
                    const y = PAD + plotH - (d[key] / maxVal) * plotH;
                    return `<circle cx="${x}" cy="${y}" r="3" fill="${colors[ki]}"/>`;
                }).join('');
                return `<polyline points="${points.join(' ')}" fill="none" stroke="${colors[ki]}" stroke-width="2"/>${dots}`;
            }).join('');

            // Y axis labels
            let yLabels = '';
            for (let i = 0; i <= 4; i++) {
                const y = PAD + plotH - (i / 4) * plotH;
                const val = (maxVal * i / 4);
                const label = unit === '$' ? '$' + val.toFixed(4) : val >= 1000 ? (val/1000).toFixed(1)+'k' : val.toFixed(0);
                yLabels += `<text x="${PAD-4}" y="${y+4}" text-anchor="end" class="axis-label">${label}</text>`;
                yLabels += `<line x1="${PAD}" y1="${y}" x2="${W-PAD}" y2="${y}" class="grid-line"/>`;
            }

            // X axis labels
            let xLabels = '';
            data.forEach((d, i) => {
                if (i % Math.max(1, Math.floor(data.length / 10)) === 0 || i === data.length - 1) {
                    const x = PAD + (i / Math.max(data.length - 1, 1)) * plotW;
                    xLabels += `<text x="${x}" y="${H-4}" text-anchor="middle" class="axis-label">${d.turn}</text>`;
                }
            });

            return `<svg viewBox="0 0 ${W} ${H}">${yLabels}${xLabels}${paths}</svg>`;
        }

        function renderBarChart(data, key) {
            const W = 500, H = 180, PAD = 40;
            const plotW = W - PAD * 2, plotH = H - PAD * 1.5;

            let maxVal = 0;
            data.forEach(d => { if (d[key] > maxVal) maxVal = d[key]; });
            if (maxVal === 0) maxVal = 1;

            const barW = Math.max(4, plotW / data.length - 2);
            let bars = data.map((d, i) => {
                const x = PAD + (i / data.length) * plotW + 1;
                const h = (d[key] / maxVal) * plotH;
                const y = PAD + plotH - h;
                return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="#3fb950" rx="2"/>`;
            }).join('');

            let yLabels = '';
            for (let i = 0; i <= 4; i++) {
                const y = PAD + plotH - (i / 4) * plotH;
                const val = (maxVal * i / 4);
                const label = key.includes('Savings') ? '$'+val.toFixed(4) : val >= 1000 ? (val/1000).toFixed(1)+'k' : val.toFixed(0);
                yLabels += `<text x="${PAD-4}" y="${y+4}" text-anchor="end" class="axis-label">${label}</text>`;
                yLabels += `<line x1="${PAD}" y1="${y}" x2="${W-PAD}" y2="${y}" class="grid-line"/>`;
            }

            let xLabels = '';
            data.forEach((d, i) => {
                if (i % Math.max(1, Math.floor(data.length / 10)) === 0 || i === data.length - 1) {
                    const x = PAD + (i / data.length) * plotW + barW / 2;
                    xLabels += `<text x="${x}" y="${H-4}" text-anchor="middle" class="axis-label">${d.turn}</text>`;
                }
            });

            return `<svg viewBox="0 0 ${W} ${H}">${yLabels}${xLabels}${bars}</svg>`;
        }

        function renderTable(data) {
            let rows = data.map(d => `
                <tr>
                    <td>${d.turn}</td>
                    <td class="val-default">$${d.defaultCost.toFixed(5)}</td>
                    <td class="val-sliding">$${d.slidingCost.toFixed(5)}</td>
                    <td class="val-costopt">$${d.costOptCost.toFixed(5)}</td>
                    <td class="val-default">${fmtNum(d.defaultInputTokens)}</td>
                    <td class="val-sliding">${fmtNum(d.slidingInputTokens)}</td>
                    <td class="val-costopt">${fmtNum(d.costOptInputTokens)}</td>
                    <td class="val-costopt">${fmtNum(d.cacheReadTokens)}</td>
                    <td class="val-costopt">$${d.cacheReadSavings.toFixed(5)}</td>
                    <td>${d.slidingVsDefaultPct.toFixed(1)}%</td>
                    <td class="val-costopt">${d.costOptVsDefaultPct.toFixed(1)}%</td>
                </tr>`).join('');

            return `<table class="data-table">
                <tr>
                    <th>Turn</th>
                    <th>Default $</th>
                    <th>Sliding $</th>
                    <th>CostOpt $</th>
                    <th>Def Tokens</th>
                    <th>Slide Tokens</th>
                    <th>CostOpt Tokens</th>
                    <th>Cache Reads</th>
                    <th>Cache Savings</th>
                    <th>Slide vs Def</th>
                    <th>CostOpt vs Def</th>
                </tr>
                ${rows}
            </table>`;
        }

        function fmtNum(n) { return n.toLocaleString(); }

        // Auto-load on page open
        loadMetrics();
        // Auto-refresh every 3 seconds
        setInterval(loadMetrics, 3000);
    </script>
</body>
</html>
